AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Infraestrutura do projeto curriculo-nuvem-aws utilizando AWS SAM.

Resources:

  TabelaContadorVisitantes:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: contar-visitantes
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      Tags:
        - Key: Project
          Value: curriculo-nuvem-aws

  ContarVisitantesLambda:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: contar-visitantes-lambda
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      CodeUri: backend/
      Timeout: 3
      
      Environment:
        Variables:
          TABLE_NAME: !Ref TabelaContadorVisitantes

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TabelaContadorVisitantes

      Events:
        CountApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculoNuvemApi
            Path: /count
            Method: GET

  CurriculoNuvemApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      Name: curriculo-nuvem-api
      StageName: $default

      CorsConfiguration:
        AllowOrigins:
          - https://barrosamorimd.work

        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type

Outputs:

  ApiUrl:
    Description: URL da API do contador de visitantes
    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com
      - ApiId: !Ref CurriculoNuvemApi

  ApiCountUrl:
    Description: URL completa do endpoint do contador
    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/count
      - ApiId: !Ref CurriculoNuvemApi

  DynamoDBTableName:
    Description: Nome da tabela DynamoDB
    Value: !Ref TabelaContadorVisitantes

  LambdaFunctionName:
    Description: Nome da função Lambda
    Value: !Ref ContarVisitantesLambda

